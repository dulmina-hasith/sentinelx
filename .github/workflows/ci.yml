name: CI

on:
  push:
    branches: [main, testing, develop]
  pull_request:
    branches: [main, testing, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up UV
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      run: uv sync --locked

    - name: Run tests
      run: uv run pytest
